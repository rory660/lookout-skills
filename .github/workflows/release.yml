name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify skill versions match tag
        run: EXPECTED_VERSION="${GITHUB_REF_NAME#v}" scripts/check-skills.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release edit "$GITHUB_REF_NAME" --verify-tag