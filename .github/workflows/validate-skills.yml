name: validate-skills

on:
  push:
    branches: [main]
    paths: [skills/**, scripts/**, .github/workflows/validate-skills.yml]
  pull_request:
    paths: [skills/**, scripts/**, .github/workflows/validate-skills.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: scripts/check-skills.sh